name: Update Rules and sing-box

on:
  push:
    branches: [main]
    paths:
      - 'Rule/**'
      - '.github/workflows/Workspace_specific_rules.yml'
  schedule:
    - cron: '0 19 * * *'  # UTC+8 (北京时间凌晨3点)
  workflow_dispatch:

concurrency:
  group: rule-update-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-and-integrate-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INTELLIGENCE_SOURCES: >-
        OpenAI Gemini Anthropic Copilot Grok Groq Perplexity
        Cursor Windsurf JetBrainsAI HuggingFace Poe ByteDanceAI
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RULE_UPDATE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch current upstream rule sources
        if: github.event_name != 'push'
        run: |
          node --input-type=module <<'MAGICRULE_JS'
          import * as fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const root = 'https://magicrule.pages.dev';
          const download = url => execFileSync('curl', [
            '--fail', '--silent', '--show-error', '--location', '--retry', '3',
            '--connect-timeout', '15', '--max-time', '120', url,
          ], { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
          const index = JSON.parse(download(`${root}/data/index/Surge.json`));
          const names = [
            ...process.env.INTELLIGENCE_SOURCES.trim().split(/\s+/),
            'Discord', 'China', 'ChinaIPs',
            'MeiTuan', 'WeChat', 'Baidu', 'DouYin', 'Google', 'Twitter', 'GitHub', 'Spotify',
            'Telegram', 'Global', 'TikTok', 'PayPal', 'XiaoHongShu',
            'Speedtest', 'Binance', 'OKX', 'Cloudflare',
          ];
          const directory = path.join(process.env.RUNNER_TEMP, 'magicrule');
          fs.mkdirSync(directory, { recursive: true });
          for (const name of names) {
            const matches = index.rules.filter(rule => rule.name === name);
            if (matches.length !== 1) throw new Error(`MagicRule: expected one Surge rule named ${name}`);
            const manifest = JSON.parse(download(matches[0].manifest));
            if (manifest.client !== 'Surge' || manifest.rule !== name) throw new Error(`MagicRule: incorrect manifest for ${name}`);
            const artifact = manifest.artifacts.find(item =>
              item.role === 'full' && item.ext === 'list' && !item.binary && !item.empty);
            if (!artifact?.url) throw new Error(`MagicRule: no complete text rules for ${name}`);
            const text = download(artifact.url);
            let lines = text.split(/\r?\n/).map(line => line.trim())
              .filter(line => line && !line.startsWith('#') && !line.startsWith('//'));
            if (!lines.length || lines.length !== manifest.total_line_count) throw new Error(`MagicRule: incomplete rules for ${name}`);
            const counts = {};
            for (const line of lines) {
              const kind = line.split(',', 1)[0];
              counts[kind] = (counts[kind] || 0) + 1;
            }
            const expected = manifest.type_counts;
            if (!expected || Object.keys(counts).length !== Object.keys(expected).length ||
                Object.entries(counts).some(([kind, count]) => expected[kind] !== count)) {
              throw new Error(`MagicRule: rule type counts do not match for ${name}`);
            }
            // The upstream Copilot category also contains unrelated AI services; retain only Copilot endpoints.
            if (name === 'Copilot') {
              const domains = [
                'copilot.microsoft.com', 'copilot.cloud.microsoft', 'copilot.com', 'copilot-stg.com',
                'githubcopilot.com', 'copilot-proxy.githubusercontent.com',
                'copilot-telemetry-service.githubusercontent.com', 'copilot-telemetry.githubusercontent.com',
                'copilot-workspace.githubnext.com', 'copilotprodattachments.blob.core.windows.net',
                'sydney.bing.com', 'edgeservices.bing.com', 'bing-shopping.microsoft-falcon.io',
                'gateway.bingviz.microsoft.net', 'gateway.bingviz.microsoftapp.net',
                'api.msn.com', 'assets.msn.com', 'api.microsoftapp.net', 'location.microsoft.com',
                'odc.officeapps.live.com', 'self.events.data.microsoft.com', 'in.appcenter.ms',
              ];
              lines = lines.filter(line => {
                const [kind, domain] = line.split(',');
                return ['DOMAIN', 'DOMAIN-SUFFIX'].includes(kind) &&
                  domains.some(host => domain === host || domain.endsWith('.' + host));
              });
              for (const host of ['copilot.microsoft.com', 'githubcopilot.com']) {
                if (!lines.includes(`DOMAIN-SUFFIX,${host}`)) throw new Error(`MagicRule: missing Copilot endpoint ${host}`);
              }
            }
            // Surge.conf already applies GEOIP,CN; headless sing-box sets cannot embed a GeoIP database.
            if (name === 'China') lines = lines.filter(line => !/^GEOIP,CN(?:,no-resolve)?$/.test(line));
            // Import explicit networks instead of expanding thousands of country-wide ASNs at build time.
            if (name === 'ChinaIPs') lines = lines.filter(line => /^(IP-CIDR|IP-CIDR6),/.test(line));
            if (!lines.length) throw new Error(`MagicRule: no importable rules for ${name}`);
            fs.writeFileSync(path.join(directory, `${name}.list`), lines.join('\n') + '\n');
            console.log(`${name}: ${lines.length} rules from ${artifact.url}`);
          }
          const directUrl = 'https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt';
          const direct = [...new Set(download(directUrl).split(/\r?\n/).map(line => line.trim())
            .filter(line => line && !line.startsWith('#') && !line.startsWith('//')))];
          if (direct.length < 10000 || direct.some(line => !/^(DOMAIN|DOMAIN-SUFFIX),[^,\s]+$/.test(line))) {
            throw new Error('Loyalsoldier: incomplete or invalid mainland domain rules');
          }
          fs.writeFileSync(path.join(directory, 'LoyalsoldierDirect.list'), direct.join('\n') + '\n');
          console.log(`Loyalsoldier Direct: ${direct.length} rules from ${directUrl}`);
          MAGICRULE_JS

      - name: Create Rule directory
        run: mkdir -p Rule

      - name: Fetch and Integrate Intelligence Rules
        if: github.event_name != 'push'
        run: |
          echo "# Intelligence Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Intelligence.list
          echo "" >> Rule/Intelligence.list
          {
            read -r -a intelligence_sources <<< "$INTELLIGENCE_SOURCES"
            for source in "${intelligence_sources[@]}"; do
              cat "$RUNNER_TEMP/magicrule/$source.list"
            done
            # Dia
            echo "DOMAIN-KEYWORD,diabrowser"
            # Copilot endpoints missing from the current upstream category
            echo "DOMAIN-SUFFIX,copilot.cloud.microsoft"
            echo "DOMAIN-SUFFIX,copilot.com"
            echo "DOMAIN-SUFFIX,copilot-stg.com"
            # Muse and Meta AI
            echo "DOMAIN-SUFFIX,muse.ai"
            echo "DOMAIN-SUFFIX,meta.ai"
            echo "DOMAIN-SUFFIX,meta.com"
            echo "DOMAIN-SUFFIX,metademolab.com"
            # Grok authentication and telemetry
            echo "DOMAIN,api3.siftscience.com"
            echo "DOMAIN,xai.chronosphere.io"
            echo "DOMAIN-KEYWORD,xai"
            # Perplexity
            echo "DOMAIN-KEYWORD,pplx"
            # Manus
            echo "DOMAIN-SUFFIX,manus.im"
            echo "DOMAIN-SUFFIX,manuscdn.com"
            # Mistral
            echo "DOMAIN-SUFFIX,mistral.ai"
            # Midjourney
            echo "DOMAIN-SUFFIX,midjourney.com"
            # Apple Intelligence
            echo "DOMAIN-KEYWORD,apple-relay"
            echo "DOMAIN-SUFFIX,apple-relay.apple.com"
            echo "DOMAIN-SUFFIX,apple-relay.fastly-edge.com"
            echo "DOMAIN-SUFFIX,apple-relay.cloudflare.com"
            echo "DOMAIN-SUFFIX,gateway.icloud.com"
            echo "DOMAIN-SUFFIX,guzzoni.apple.com"
            echo "DOMAIN-SUFFIX,cp4.cloudflare.com"
            echo "DOMAIN-SUFFIX,gspe1-ssl.ls.apple.com"
            echo "DOMAIN-SUFFIX,apps.mzstatic.com"
            # OpenAI and Anthropic supplements
            echo "DOMAIN,anthropic.auth0.com"
            echo "DOMAIN-SUFFIX,sentry.io"
            echo "DOMAIN-SUFFIX,statsigapi.net"
            echo "DOMAIN,browser-intake-us5-datadoghq.com"
            echo "DOMAIN-KEYWORD,datadog"
            echo "DOMAIN-KEYWORD,sift"
            echo "DOMAIN-SUFFIX,intercom.io"
            echo "DOMAIN-SUFFIX,intercomcdn.com"
            echo "DOMAIN,cdn.usefathom.com"
            echo "IP-CIDR,160.79.104.0/21,no-resolve"
            echo "IP-CIDR6,2607:6bc0::/32,no-resolve"
            echo "IP-ASN,399358,no-resolve"
            # Suno
            echo "DOMAIN-SUFFIX,suno.ai"
            echo "DOMAIN-SUFFIX,suno.com"
            # Local application paths
            echo "PROCESS-NAME,/Applications/Claude.app/"
            echo "PROCESS-NAME,/Applications/ChatGPT.app/"
            echo "PROCESS-NAME,/Applications/ChatGPT Classic.app/"
            echo "PROCESS-NAME,/Applications/Antigravity.app/"
            echo "PROCESS-NAME,/opt/homebrew/bin/codex"
            echo "PROCESS-NAME,/opt/homebrew/bin/claude"
          } | sed -E 's/,[[:space:]]+/,/g; s/[[:space:]]+$//' | grep -v '^#' | grep -E '^(AND|DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|IP-ASN|PROCESS-NAME),' | sort | uniq >> Rule/Intelligence.list

      - name: Fetch and Format Discord Rules
        if: github.event_name != 'push'
        run: |
          echo "# Discord Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Discord.list
          echo "" >> Rule/Discord.list
          cat "$RUNNER_TEMP/magicrule/Discord.list" | grep -v '^#' | sort | uniq >> Rule/Discord.list

      - name: Fetch and Integrate CN Rules
        if: github.event_name != 'push'
        run: |
          echo "# CN Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/CN.list
          echo "" >> Rule/CN.list
          {
            cat "$RUNNER_TEMP/magicrule/LoyalsoldierDirect.list"
            cat "$RUNNER_TEMP/magicrule/China.list"
            cat "$RUNNER_TEMP/magicrule/ChinaIPs.list"
            cat "$RUNNER_TEMP/magicrule/MeiTuan.list"
            cat "$RUNNER_TEMP/magicrule/WeChat.list"
            cat "$RUNNER_TEMP/magicrule/Baidu.list"
            cat "$RUNNER_TEMP/magicrule/DouYin.list"
          } | grep -v '^#' | sort | uniq >> Rule/CN.list

      - name: Fetch and Format Google Rules
        if: github.event_name != 'push'
        run: |
          echo "# Google Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Google.list
          echo "" >> Rule/Google.list
          cat "$RUNNER_TEMP/magicrule/Google.list" | grep -v '^#' | sort | uniq >> Rule/Google.list

      - name: Fetch and Format X (Twitter) Rules
        if: github.event_name != 'push'
        run: |
          echo "# X Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/X.list
          echo "" >> Rule/X.list
          cat "$RUNNER_TEMP/magicrule/Twitter.list" | grep -v '^#' | sort | uniq >> Rule/X.list

      - name: Fetch and Format Github Rules
        if: github.event_name != 'push'
        run: |
          echo "# Github Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Github.list
          echo "" >> Rule/Github.list
          cat "$RUNNER_TEMP/magicrule/GitHub.list" | grep -v '^#' | sort | uniq >> Rule/Github.list

      - name: Fetch and Format FuckAds Rules
        if: github.event_name != 'push'
        run: |
          echo "# FuckAds Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/FuckAds.list
          echo "" >> Rule/FuckAds.list
          {
            curl -fsSL --retry 3 --max-time 120 https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
            echo "DOMAIN-SUFFIX,d.meituan.net"
            echo "DOMAIN-SUFFIX,analytics.meituan.net"
            echo "DOMAIN-SUFFIX,meituan.xn"
            echo "DOMAIN-SUFFIX,meituan.yoga"
            echo "DOMAIN-SUFFIX,meituangov.cn"
            echo "DOMAIN-SUFFIX,report.meituan.com"
            echo "DOMAIN-SUFFIX,wmlog.meituan.com"
            echo "DOMAIN-SUFFIX,ad.e.waimai.sankuai.com"
            echo "DOMAIN-SUFFIX,mads.meituan.com"
            echo "DOMAIN-SUFFIX,dreport.meituan.net"
            echo "DOMAIN,flowplus.meituan.net"
            echo "DOMAIN-WILDCARD,pcdn.biliapi.net"
            echo "DOMAIN-SUFFIX,mcdn.bilivideo.cn"
            echo "DOMAIN-SUFFIX,mcdn.bilivideo.com"
            echo "DOMAIN-SUFFIX,szbdyd.com"
            echo "DOMAIN-SUFFIX,mountaintoys.cn"
            echo "IP-CIDR,103.37.155.60/32, no-resolve"
          } | grep -v '^#' | sort | uniq >> Rule/FuckAds.list

      - name: Fetch and Format Spotify Rules
        if: github.event_name != 'push'
        run: |
          echo "# Spotify Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Spotify.list
          echo "" >> Rule/Spotify.list
          cat "$RUNNER_TEMP/magicrule/Spotify.list" | grep -v '^#' | sort | uniq >> Rule/Spotify.list

      - name: Fetch and Format Telegram Rules
        if: github.event_name != 'push'
        run: |
          echo "# Telegram Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Telegram.list
          echo "" >> Rule/Telegram.list
          cat "$RUNNER_TEMP/magicrule/Telegram.list" | grep -v '^#' | sort | uniq >> Rule/Telegram.list

      - name: Fetch and Format Proxy Rules
        if: github.event_name != 'push'
        run: |
          echo "# Proxy Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Proxy.list
          echo "" >> Rule/Proxy.list
          {
            cat "$RUNNER_TEMP/magicrule/Global.list"
            cat "$RUNNER_TEMP/magicrule/Cloudflare.list"
            echo "DOMAIN-KEYWORD,browserleaks"
            echo "DOMAIN-SUFFIX,net.coffee"
          } | grep -v '^#' | sort | uniq >> Rule/Proxy.list

      - name: Fetch and Format TikTok Rules
        if: github.event_name != 'push'
        run: |
          echo "# TikTok Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/TikTok.list
          echo "" >> Rule/TikTok.list
          cat "$RUNNER_TEMP/magicrule/TikTok.list" | grep -v '^#' | sort | uniq >> Rule/TikTok.list

      - name: Fetch and Format PayPal Rules
        if: github.event_name != 'push'
        run: |
          echo "# PayPal Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/PayPal.list
          echo "" >> Rule/PayPal.list
          cat "$RUNNER_TEMP/magicrule/PayPal.list" | grep -v '^#' | sort | uniq >> Rule/PayPal.list

      - name: Fetch and Format XiaoHongShu Rules
        if: github.event_name != 'push'
        run: |
          echo "# XiaoHongShu Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/XHS.list
          echo "" >> Rule/XHS.list
          cat "$RUNNER_TEMP/magicrule/XiaoHongShu.list" | grep -v '^#' | sort | uniq >> Rule/XHS.list

      - name: Fetch and Format Apple Rules
        if: github.event_name != 'push'
        run: |
          echo "# Apple Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Apple.list
          echo "" >> Rule/Apple.list
          curl -fsSL --retry 3 --max-time 120 https://raw.githubusercontent.com/Blankwonder/surge-list/master/apple.list | grep -v '^#' | sort | uniq >> Rule/Apple.list

      - name: Fetch and Format Speedtest Rules
        if: github.event_name != 'push'
        run: |
          echo "# Speedtest Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Speedtest.list
          echo "" >> Rule/Speedtest.list
          cat "$RUNNER_TEMP/magicrule/Speedtest.list" | grep -v '^#' | sort | uniq >> Rule/Speedtest.list

      - name: Fetch and Format Binance Rules
        if: github.event_name != 'push'
        run: |
          echo "# Binance Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/Binance.list
          echo "" >> Rule/Binance.list
          {
            cat "$RUNNER_TEMP/magicrule/Binance.list"
            echo "DOMAIN-SUFFIX,binance.info"
            echo "DOMAIN-KEYWORD,binance"
          } | grep -v '^#' | sort | uniq >> Rule/Binance.list

      - name: Fetch and Format OKX Rules
        if: github.event_name != 'push'
        run: |
          echo "# OKX Rules - Fetched on $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S GMT+8')" > Rule/OKX.list
          echo "" >> Rule/OKX.list
          {
            cat "$RUNNER_TEMP/magicrule/OKX.list"
            echo "DOMAIN-KEYWORD,okx"
            echo "DOMAIN,www.okx.com.cdn.cloudflare.net"
            echo "DOMAIN-KEYWORD,ipyp0a"
            echo "DOMAIN-KEYWORD,d2p7qknqur0nu9"
            echo "DOMAIN-KEYWORD,d1nil3qbkxfj92"
            echo "DOMAIN,api.onesignal.com"
            echo "DOMAIN,api.amplitudeexperiment.com"
            echo "DOMAIN-KEYWORD,d1w1p0smpsoh5j"
            echo "DOMAIN-SUFFIX,online-metrix.net"
          } | grep -v '^#' | sort | uniq >> Rule/OKX.list

      - name: Ensure IP rules use no-resolve
        if: github.event_name != 'push'
        run: |
          files=(
            Rule/Intelligence.list
            Rule/Discord.list
            Rule/CN.list
            Rule/Google.list
            Rule/X.list
            Rule/Github.list
            Rule/FuckAds.list
            Rule/Spotify.list
            Rule/Telegram.list
            Rule/Proxy.list
            Rule/TikTok.list
            Rule/PayPal.list
            Rule/XHS.list
            Rule/Apple.list
            Rule/Speedtest.list
            Rule/Binance.list
            Rule/OKX.list
          )

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            tmp="$(mktemp)"
            awk '
              /^[[:space:]]*(IP-CIDR|IP-CIDR6|IP-ASN),/ {
                line = $0
                sub(/^[[:space:]]+/, "", line)
                gsub(/,[[:space:]]+/, ",", line)
                sub(/[[:space:]]+$/, "", line)
                if (line !~ /(^|,)no-resolve([[:space:]]*(,|$))/) {
                  line = line ",no-resolve"
                }
                if (!seen[line]++) {
                  print line
                }
                next
              }
              !seen[$0]++ {
                print
              }
            ' "$file" > "$tmp"
            mv "$tmp" "$file"
          done

      - name: Install pinned sing-box compiler
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl -fL --retry 3 --max-time 180 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz \
            -o "$work/sing-box.tar.gz"
          echo "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  $work/sing-box.tar.gz" | sha256sum --check
          tar -xzf "$work/sing-box.tar.gz" -C "$work"
          echo "$work/sing-box-1.14.0-linux-amd64" >> "$GITHUB_PATH"

      - name: Test, convert and compile sing-box rules
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cat > "$work/convert.mjs" <<'CONVERTER_JS'
          #!/usr/bin/env node
          // Convert Rule/*.list using a reproducible ASN snapshot; Node.js built-ins only.
          import * as fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import { isIP } from 'node:net';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          import { parseArgs } from 'node:util';
          import { setTimeout as sleep } from 'node:timers/promises';

          const ROOT = process.env.GITHUB_WORKSPACE || process.cwd();
          export const PROVIDER = 'https://stat.ripe.net/data/ris-prefixes/data.json';
          const FIELDS = { DOMAIN: 'domain', 'DOMAIN-SUFFIX': 'domain_suffix', 'DOMAIN-KEYWORD': 'domain_keyword' };
          const NO_RESOLVE = 'no-resolve is not represented in headless rule sets';
          const dump = value => JSON.stringify(value, null, 2) + '\n';
          const sortedUnique = values => [...new Set(values)].sort();

          function splitExpression(text) {
            const parts = [];
            let start = 0, depth = 0;
            for (let i = 0; i < text.length; i++) {
              if (text[i] === '(') depth++;
              else if (text[i] === ')') {
                if (--depth < 0) throw new Error('unbalanced parentheses');
              } else if (text[i] === ',' && depth === 0) {
                parts.push(text.slice(start, i).trim());
                start = i + 1;
              }
            }
            if (depth) throw new Error('unbalanced parentheses');
            parts.push(text.slice(start).trim());
            return parts;
          }

          export function parse(text) {
            const [kind, value, ...flags] = splitExpression(text);
            if (kind === 'AND' || kind === 'OR') {
              if (flags.length || !value?.startsWith('(') || !value.endsWith(')')) throw new Error('invalid logical expression');
              const children = splitExpression(value.slice(1, -1));
              if (children.length < 2) throw new Error('logical expression requires at least two children');
              return [kind, children.map(child => {
                if (!child.startsWith('(') || !child.endsWith(')')) throw new Error('logical child must be parenthesized');
                return parse(child.slice(1, -1));
              })];
            }
            if (!value) throw new Error('missing rule value');
            if (flags.length && !(flags.length === 1 && flags[0] === 'no-resolve' && ['IP-CIDR', 'IP-CIDR6', 'IP-ASN'].includes(kind))) {
              throw new Error(`unexpected arguments: ${flags}`);
            }
            return [kind, value, flags.length > 0];
          }

          // Validate with node:net, mask host bits, and emit canonical IPv4/IPv6 CIDR.
          export function normalizeCIDR(value, expectedFamily) {
            const [address, prefix, ...extra] = value.split('/');
            const family = isIP(address);
            const bits = family === 4 ? 32 : 128;
            const length = prefix === undefined ? bits : Number(prefix);
            if (!family || address.includes('%') || extra.length || (prefix !== undefined && !/^\d+$/.test(prefix)) ||
                length < 0 || length > bits || (expectedFamily && expectedFamily !== family)) throw new Error(`invalid CIDR: ${value}`);
            let groups;
            if (family === 4) groups = address.split('.').map(Number);
            else {
              let expanded = address;
              if (address.includes('.')) {
                const i = address.lastIndexOf(':');
                const octets = address.slice(i + 1).split('.').map(Number);
                expanded = address.slice(0, i + 1) + ((octets[0] << 8) | octets[1]).toString(16) + ':' + ((octets[2] << 8) | octets[3]).toString(16);
              }
              const [left, right] = expanded.split('::');
              const a = left ? left.split(':') : [];
              const b = right ? right.split(':') : [];
              groups = (right === undefined ? a : [...a, ...Array(8 - a.length - b.length).fill('0'), ...b]).map(v => parseInt(v, 16));
            }
            const width = family === 4 ? 8n : 16n;
            let number = groups.reduce((result, group) => (result << width) | BigInt(group), 0n);
            const hostBits = BigInt(bits - length);
            number = (number >> hostBits) << hostBits;
            const masked = Array(family === 4 ? 4 : 8);
            for (let i = masked.length - 1; i >= 0; i--) {
              masked[i] = Number(number & ((1n << width) - 1n));
              number >>= width;
            }
            if (family === 4) return masked.join('.') + '/' + length;
            let bestStart = -1, bestLength = 1;
            for (let i = 0; i < 8;) {
              if (masked[i] !== 0) { i++; continue; }
              const start = i;
              while (i < 8 && masked[i] === 0) i++;
              if (i - start > bestLength) { bestStart = start; bestLength = i - start; }
            }
            const hex = masked.map(v => v.toString(16));
            const canonical = bestStart < 0 ? hex.join(':') : hex.slice(0, bestStart).join(':') + '::' + hex.slice(bestStart + bestLength).join(':');
            return canonical + '/' + length;
          }

          const networks = values => sortedUnique(values.map(v => normalizeCIDR(v)));
          function asnKey(value) {
            if (!/^\d+$/.test(value) || Number(value) < 1 || Number(value) > 4294967295) throw new Error('invalid ASN');
            return String(Number(value));
          }

          export function translate(node, asns, warnings, nested = false) {
            const [kind, value, noResolve] = node;
            if (kind === 'AND' || kind === 'OR') return { type: 'logical', mode: kind.toLowerCase(), rules: value.map(child => translate(child, asns, warnings, true)) };
            if (noResolve) warnings.push(NO_RESOLVE);
            if (Object.hasOwn(FIELDS, kind)) {
              if (/\s/.test(value)) throw new Error('whitespace in domain value');
              return { [FIELDS[kind]]: [value] };
            }
            if (kind === 'DOMAIN-WILDCARD') {
              if (/\s/.test(value)) throw new Error('whitespace in domain wildcard');
              if (/[\[\]\\]/.test(value)) throw new Error('domain wildcard character classes and escapes are unsupported');
              const pattern = value.replace(/[.*+?^${}()|[\]\\]/g, char => char === '*' ? '.*' : char === '?' ? '.' : '\\' + char);
              return { domain_regex: ['(?i)^' + pattern + '$'] };
            }
            if (kind === 'IP-CIDR' || kind === 'IP-CIDR6') return { ip_cidr: [normalizeCIDR(value, kind === 'IP-CIDR' ? 4 : 6)] };
            if (kind === 'IP-ASN') {
              const prefixes = networks(asns[asnKey(value)]?.prefixes ?? []);
              if (!prefixes.length) throw new Error(`missing or empty ASN snapshot: AS${value}`);
              return { ip_cidr: prefixes };
            }
            if (kind === 'PROCESS-NAME') {
              if (value.startsWith('/')) {
                if (value.endsWith('.app/')) {
                  warnings.push('app directory mapped to process_path_regex prefix');
                  return { process_path_regex: ['^' + value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')] };
                }
                return { process_path: [value] };
              }
              if (/^[a-z][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*){2,}$/.test(value)) {
                warnings.push('package-like process mapped to process_name OR package_name');
                return { type: 'logical', mode: 'or', rules: [{ process_name: [value] }, { package_name: [value] }] };
              }
              return { process_name: [value] };
            }
            if (kind === 'USER-AGENT') {
              if (nested) throw new Error('USER-AGENT inside logical expression is unsupported');
              warnings.push('USER-AGENT omitted: unsupported by sing-box');
              return null;
            }
            throw new Error(`unsupported selector: ${kind}`);
          }

          export function readSources(source) {
            const sources = new Map();
            for (const name of fs.readdirSync(source).filter(name => name.endsWith('.list')).sort()) {
              const rows = [];
              fs.readFileSync(path.join(source, name), 'utf8').split(/\r?\n/).forEach((raw, index) => {
                const line = raw.split(/\s+(?:\/\/|#)/, 1)[0].trim();
                if (!line || line.startsWith('#') || line.startsWith('//')) return;
                try { rows.push([index + 1, line, parse(line)]); }
                catch (error) { throw new Error(`${name}:${index + 1}: ${error.message}`); }
              });
              sources.set(name, rows);
            }
            if (!sources.size) throw new Error(`no .list files in ${source}`);
            return sources;
          }

          function collectAsns(node) {
            if (node[0] === 'AND' || node[0] === 'OR') return node[1].flatMap(collectAsns);
            return node[0] === 'IP-ASN' ? [asnKey(node[1])] : [];
          }

          export async function refreshAsns(required, old, fetcher = fetch, pause = sleep) {
            const entries = {};
            for (const asn of [...required].sort((a, b) => Number(a) - Number(b))) {
              const saved = old.version === 1 && old.provider === PROVIDER ? old.asns?.[asn] : null;
              const previous = typeof saved?.query_time === 'string' && saved.query_time &&
                Array.isArray(saved.prefixes) && saved.prefixes.length ? saved : null;
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const response = await fetcher(`${PROVIDER}?resource=AS${asn}&list_prefixes=true&types=o`, { signal: AbortSignal.timeout(45000) });
                  if (!response.ok) throw new Error(`RIPEstat HTTP ${response.status}`);
                  const payload = await response.json();
                  if (payload.status !== 'ok') throw new Error(`RIPEstat failed for AS${asn}`);
                  const data = payload.data;
                  const prefixes = networks([...data.prefixes.v4.originating, ...data.prefixes.v6.originating]);
                  if (!prefixes.length || !data.query_time) throw new Error(`empty or invalid ASN response: AS${asn}`);
                  entries[asn] = JSON.stringify(previous?.prefixes) === JSON.stringify(prefixes) ? previous : { query_time: data.query_time, prefixes };
                  console.log(`AS${asn}: ${prefixes.length} prefixes`);
                  break;
                } catch (error) {
                  if (attempt === 2) {
                    if (!previous) throw new Error(`AS${asn}: ${error.message}; no usable saved ASN snapshot`);
                    let prefixes;
                    try { prefixes = networks(previous.prefixes); }
                    catch (snapshotError) { throw new Error(`AS${asn}: ${error.message}; invalid saved ASN snapshot: ${snapshotError.message}`); }
                    entries[asn] = { ...previous, prefixes };
                    console.warn(`AS${asn}: refresh failed (${error.message}); using saved snapshot from ${previous.query_time} (${prefixes.length} prefixes)`);
                    break;
                  }
                  await pause((attempt + 1) * 1000);
                }
              }
            }
            return { version: 1, provider: PROVIDER, asns: entries };
          }

          function canonical(value) {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])]));
            return value;
          }

          export function convert(rows, asns) {
            const buckets = new Map(), logical = new Map(), warnings = [];
            let noResolveCount = 0;
            for (const [number, line, node] of rows) {
              const notes = [];
              let rule;
              try { rule = translate(node, asns, notes); }
              catch (error) { throw new Error(`line ${number}: ${error.message}`); }
              noResolveCount += notes.filter(note => note === NO_RESOLVE).length;
              const otherNotes = sortedUnique(notes.filter(note => note !== NO_RESOLVE));
              if (otherNotes.length) warnings.push({ line: number, rule: line, notes: otherNotes });
              if (!rule) continue;
              if (rule.type) logical.set(JSON.stringify(canonical(rule)), rule);
              else for (const [key, values] of Object.entries(rule)) {
                if (!buckets.has(key)) buckets.set(key, new Set());
                for (const value of values) buckets.get(key).add(value);
              }
            }
            // Separate single-field buckets preserve OR; never combine domain and process fields.
            const rules = [...buckets.keys()].sort().map(key => ({ [key]: [...buckets.get(key)].sort() }));
            rules.push(...[...logical.keys()].sort().map(key => logical.get(key)));
            if (!rules.length) throw new Error('conversion produced an empty rule set');
            if (noResolveCount) warnings.push({ kind: 'no-resolve', occurrences: noResolveCount, note: 'DNS resolution behavior must be configured by the consumer' });
            return [{ version: 2, rules }, warnings];
          }

          async function main() {
            const { values: args } = parseArgs({ options: { 'refresh-asn': { type: 'boolean', default: false }, 'sing-box': { type: 'string' } } });
            const sources = readSources(path.join(ROOT, 'Rule'));
            const lockPath = path.join(ROOT, 'singbox/asn.json');
            let lock = fs.existsSync(lockPath) ? JSON.parse(fs.readFileSync(lockPath, 'utf8')) : {};
            const required = new Set([...sources.values()].flatMap(rows => rows.flatMap(row => collectAsns(row[2]))));
            if (args['refresh-asn']) lock = await refreshAsns(required, lock);
            if (lock.version !== 1 || lock.provider !== PROVIDER) throw new Error('missing or invalid ASN snapshot; run with --refresh-asn');
            const report = { source: 'Rule', rule_set_version: 2, asn_snapshot: 'singbox/asn.json', files: {} };
            const stage = fs.mkdtempSync(path.join(os.tmpdir(), 'ukix-singbox-'));
            try {
              for (const [name, rows] of sources) {
                let result, warnings;
                try { [result, warnings] = convert(rows, lock.asns); }
                catch (error) { throw new Error(`Rule/${name}: ${error.message}`); }
                const output = path.join(stage, name.replace(/\.list$/, '.json'));
                fs.writeFileSync(output, dump(result));
                if (args['sing-box']) execFileSync(args['sing-box'], ['rule-set', 'compile', '--output', output.replace(/\.json$/, '.srs'), output], { stdio: 'inherit' });
                report.files[name] = { source_sha256: createHash('sha256').update(fs.readFileSync(path.join(ROOT, 'Rule', name))).digest('hex'), source_rules: rows.length, output_rules: result.rules.length, warnings };
              }
              const dest = path.join(ROOT, 'singbox/rule');
              fs.mkdirSync(dest, { recursive: true });
              const expected = new Set(fs.readdirSync(stage));
              for (const name of expected) fs.copyFileSync(path.join(stage, name), path.join(dest, name));
              for (const name of fs.readdirSync(dest)) if (/\.(json|srs)$/.test(name) && !expected.has(name)) fs.unlinkSync(path.join(dest, name));
            } finally { fs.rmSync(stage, { recursive: true, force: true }); }
            fs.writeFileSync(lockPath, dump(lock));
            fs.writeFileSync(path.join(ROOT, 'singbox/conversion-report.json'), dump(report));
            console.log(`Converted ${sources.size} rule sets`);
          }

          if (process.argv[1] && fs.realpathSync(process.argv[1]) === fileURLToPath(import.meta.url)) {
            main().catch(error => { console.error(error.message); process.exitCode = 1; });
          }
          CONVERTER_JS
