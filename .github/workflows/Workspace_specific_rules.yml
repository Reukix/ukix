        env:
          TZ: Asia/Singapore
        run: |
          git config user.name 'Reukix'
          git config user.email '120629904+Reukix@users.noreply.github.com'
          git add Rule/Intelligence.list Rule/Discord.list Rule/CN.list Rule/Google.list Rule/X.list Rule/Github.list Rule/FuckAds.list Rule/Spotify.list Rule/Telegram.list Rule/Proxy.list Rule/TikTok.list Rule/PayPal.list Rule/XHS.list Rule/Apple.list Rule/Speedtest.list Rule/Binance.list Rule/OKX.list
          git add singbox/rule singbox/asn.json singbox/conversion-report.json
          if git diff --staged --quiet; then
            echo "No changes to commit for source and sing-box rules."
          else
            COMMIT_TIME=$(date +'%Y-%m-%d %H:%M:%S GMT+8')
            git commit -m "Update rule lists - $COMMIT_TIME [skip ci]"
            git push
          fi
