              ].map(host => [host, 'Proxy']),
            ];
            for (const [file, pattern] of [
              ['Surge.conf', /^RULE-SET,http:\/\/river\/([^,]+),([^,]+)/],
              ['loon.lcf', /^https:\/\/raw\.githubusercontent\.com\/Reukix\/ukix\/main\/Rule\/([^,]+)\.list,\s*policy=([^,]+)/],
            ]) {
              const routes = fs.readFileSync(path.join(root, file), 'utf8').split(/\r?\n/)
                .map(line => line.trim().match(pattern)).filter(Boolean)
                .map(([, name, policy]) => [name + '.list', policy]);
              assert.ok(routes.length, `no rule sets found in ${file}`);
              for (const [host, expected] of cases) {
                const match = routes.find(([name]) => {
                  const rows = sources.get(name);
                  assert.ok(rows, `missing ${name} referenced by ${file}`);
                  return rows.some(row => matches(row[2], host));
                });
                assert.equal(match?.[1] ?? 'Proxy', expected, `${file}: ${host}`);
              }
            }
          });
          TEST_JS
          node --test "$work/convert.test.mjs"
          node "$work/convert.mjs" --refresh-asn --sing-box "$(command -v sing-box)"

